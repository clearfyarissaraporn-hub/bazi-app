<script>
// BaZi engine for any person — no dependencies, deterministic.
// Works in browser, React Native, or Node (ES module).
// Symbolic readings only: not a prediction of real events, not financial or medical advice.

const VERSION = '2.3.0';
const STEMS = '甲乙丙丁戊己庚辛壬癸';
const BRANCHES = '子丑寅卯辰巳午未申酉戌亥';
const EL = ['wood', 'fire', 'earth', 'metal', 'water'];
const S_EL = [0, 0, 1, 1, 2, 2, 3, 3, 4, 4]; // index into EL
const B_EL = [4, 2, 0, 0, 2, 1, 1, 2, 3, 3, 2, 4];
const EL_TH = { wood: 'ไม้', fire: 'ไฟ', earth: 'ดิน', metal: 'ทอง', water: 'น้ำ' };
const ANIMAL = ['หนู', 'วัว', 'เสือ', 'กระต่าย', 'มังกร', 'งู', 'ม้า', 'แพะ', 'ลิง', 'ไก่', 'หมา', 'หมู'];
const MONTH_TH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
// hidden stems [stem, weight]
const HIDDEN = [[[9, 1]], [[5, 1], [9, .5], [7, .3]], [[0, 1], [2, .5], [4, .3]], [[1, 1]], [[4, 1], [1, .5], [9, .3]],
  [[2, 1], [6, .5], [4, .3]], [[3, 1], [5, .5]], [[5, 1], [3, .5], [1, .3]], [[6, 1], [8, .5], [4, .3]], [[7, 1]],
  [[4, 1], [7, .5], [3, .3]], [[8, 1], [0, .5]]];
const EARTH_B = new Set([1, 4, 7, 10]);
const HARM = [[0, 7], [1, 6], [2, 5], [3, 4], [8, 11], [9, 10]];
const SIX = [[0, 1, 2], [2, 11, 0], [3, 10, 1], [4, 9, 3], [5, 8, 4], [6, 7, 1]]; // a, b, element
const TRINE = [[[8, 0, 4], 4], [[11, 3, 7], 0], [[2, 6, 10], 1], [[5, 9, 1], 3]];
const DIREC = [[[2, 3, 4], 0], [[5, 6, 7], 1], [[8, 9, 10], 3], [[11, 0, 1], 4]];
const PUNISH3 = [[2, 5, 8], [1, 10, 7]];
const SELF_P = new Set([4, 6, 9, 11]);

const mod = (a, n) => ((a % n) + n) % n;
const r2 = (x) => Math.round(x * 100) / 100;
const pillar = (s, b) => STEMS[s] + BRANCHES[b];

// ------------------------------------------------------------ astronomy
const J2000 = Date.UTC(2000, 0, 1, 12);
const jdOf = (ms) => 2451545 + (ms - J2000) / 86400000;
const msOf = (jd) => J2000 + (jd - 2451545) * 86400000;
function sunLon(jd) {
  const T = (jd - 2451545) / 36525;
  const L0 = mod(280.46646 + 36000.76983 * T + 0.0003032 * T * T, 360);
  const M = (mod(357.52911 + 35999.05029 * T - 0.0001537 * T * T, 360) * Math.PI) / 180;
  const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M)
    + (0.019993 - 0.000101 * T) * Math.sin(2 * M) + 0.000289 * Math.sin(3 * M);
  const om = ((125.04 - 1934.136 * T) * Math.PI) / 180;
  return mod(L0 + C - 0.00569 - 0.00478 * Math.sin(om), 360);
}
const termCache = new Map();
/** UTC ms when the sun reaches `lon` during Gregorian year `y`. */
function termTime(y, lon) {
  const key = y * 1000 + lon;
  if (termCache.has(key)) return termCache.get(key);
  const off = (mod(lon - 280, 360) / 360) * 365.2422;
  const j0 = jdOf(Date.UTC(y, 0, 1)) + off;
  let lo = j0 - 9, hi = j0 + 9;
  const f = (j) => mod(sunLon(j) - lon + 180, 360) - 180;
  for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (f(m) < 0) lo = m; else hi = m; }
  const t = msOf((lo + hi) / 2);
  termCache.set(key, t);
  return t;
}
const JIE = [285, 315, 345, 15, 45, 75, 105, 135, 165, 195, 225, 255]; // Jan..Dec
const jieBranch = (lon) => mod(2 + mod(lon - 315, 360) / 30, 12);
function jieAround(ms) {
  const y = new Date(ms).getUTCFullYear();
  const out = [];
  for (const yy of [y - 1, y, y + 1]) for (const l of JIE) out.push({ t: termTime(yy, l), lon: l });
  return out.sort((a, b) => a.t - b.t);
}
/** Chinese (solar) year containing instant ms: changes at 立春. */
function chineseYear(ms) {
  const y = new Date(ms).getUTCFullYear();
  return ms >= termTime(y, 315) ? y : y - 1;
}
function yearPillarOf(cy) { return [mod(cy - 4, 10), mod(cy - 4, 12)]; }
function monthStem(yearStem, branch) { return mod(mod(yearStem, 5) * 2 + 2 + mod(branch - 2, 12), 10); }
function monthAt(ms) {
  const js = jieAround(ms);
  let i = js.length - 1;
  while (js[i].t > ms) i--;
  const b = jieBranch(js[i].lon);
  const ys = yearPillarOf(chineseYear(ms))[0];
  return { stem: monthStem(ys, b), branch: b, start: js[i].t, end: js[i + 1].t, prevJie: js[i].t, nextJie: js[i + 1].t };
}
function jdn(y, m, d) {
  const a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
  return d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
}
function dayPillarOfDate(y, m, d) { const i = mod(jdn(y, m, d) + 49, 60); return [i % 10, i % 12]; }
function eqTimeMin(y, m, d) {
  const n = jdn(y, m, d) - jdn(y, 1, 1) + 1;
  const B = (2 * Math.PI * (n - 81)) / 365;
  return 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
}

// ------------------------------------------------------------ natal chart
/**
 * @param {object} p {name, date:'YYYY-MM-DD', time:'HH:MM'|null, gender:'F'|'M', tz:+7, longitude:null|number, ziNextDay:true}
 */
function natalChart(p) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(p.date || '');
  if (!m) throw new Error('date ต้องเป็น YYYY-MM-DD');
  const [Y, M, D] = [+m[1], +m[2], +m[3]];
  if (M < 1 || M > 12 || D < 1 || D > 31 || Y < 1900 || Y > 2100) throw new Error('วันที่ไม่ถูกต้อง (รองรับปี 1900–2100)');
  if (!['F', 'M'].includes(p.gender)) throw new Error('gender ต้องเป็น F หรือ M');
  const tz = p.tz ?? 7;
  const hasTime = !!p.time;
  let hh = 12, mi = 0;
  if (hasTime) {
    const t = /^(\d{1,2}):(\d{2})$/.exec(p.time);
    if (!t || +t[1] > 23 || +t[2] > 59) throw new Error('time ต้องเป็น HH:MM');
    hh = +t[1]; mi = +t[2];
  }
  const check = new Date(Date.UTC(Y, M - 1, D));
  if (check.getUTCMonth() !== M - 1) throw new Error('วันที่ไม่มีอยู่จริง');
  const birthMs = Date.UTC(Y, M - 1, D, hh, mi) - tz * 3600000; // real instant
  // local (optionally true solar) clock for day & hour pillars
  let corr = 0;
  if (hasTime && typeof p.longitude === 'number') corr = (p.longitude - tz * 15) * 4 + eqTimeMin(Y, M, D);
  const localMs = Date.UTC(Y, M - 1, D, hh, mi) + corr * 60000;
  const L = new Date(localMs);
  let dy = L.getUTCFullYear(), dm = L.getUTCMonth() + 1, dd = L.getUTCDate();
  const lh = L.getUTCHours();
  if (hasTime && lh === 23 && p.ziNextDay !== false) {
    const n = new Date(Date.UTC(dy, dm - 1, dd + 1)); dy = n.getUTCFullYear(); dm = n.getUTCMonth() + 1; dd = n.getUTCDate();
  }
  const cy = chineseYear(birthMs);
  const [ys, yb] = yearPillarOf(cy);
  const mo = monthAt(birthMs);
  const [ds, db] = dayPillarOfDate(dy, dm, dd);
  let hour = null;
  if (hasTime) { const hb = Math.floor((lh + 1) / 2) % 12; hour = [mod(mod(ds, 5) * 2 + hb, 10), hb]; }
  const pillars = { year: [ys, yb], month: [mo.stem, mo.branch], day: [ds, db], hour };
  // luck pillars
  const yangYear = ys % 2 === 0;
  const forward = (yangYear && p.gender === 'M') || (!yangYear && p.gender === 'F');
  const days = (forward ? mo.nextJie - birthMs : birthMs - mo.prevJie) / 86400000;
  const YEAR = 365.2422 * 86400000;
  const luckStart = birthMs + (days / 3) * YEAR;
  const luck = [];
  for (let k = 1; k <= 10; k++) {
    const s = mod(mo.stem + (forward ? k : -k), 10), b = mod(mo.branch + (forward ? k : -k), 12);
    const st = luckStart + (k - 1) * 10 * YEAR;
    luck.push({ stem: s, branch: b, pillar: pillar(s, b), start: st, end: st + 10 * YEAR });
  }
  const strength = strengthOf(pillars);
  return { input: { ...p, tz }, birthMs, solarCorrectionMin: r2(corr), hasTime, pillars, dayMaster: ds, forward, luckStart, luck, ...strength };
}

const gen = (e) => (e + 1) % 5, ctrl = (e) => (e + 2) % 5; // wood→fire, wood→earth
function roles(dmEl) {
  return { companion: dmEl, resource: mod(dmEl - 1, 5), output: gen(dmEl), wealth: ctrl(dmEl), officer: mod(dmEl - 2, 5) };
}
function strengthOf(P) {
  const dmEl = S_EL[P.day[0]];
  const R = roles(dmEl);
  const sup = new Set([R.companion, R.resource]);
  let S = 0, T = 0;
  const add = (el, w) => { T += w; if (sup.has(el)) S += w; };
  for (const k of ['year', 'month', 'hour']) if (P[k]) add(S_EL[P[k][0]], 1);
  for (const k of ['year', 'month', 'day', 'hour']) {
    if (!P[k]) continue;
    const mult = k === 'month' ? 2.5 : k === 'day' ? 1.2 : 1;
    for (const [s, w] of HIDDEN[P[k][1]]) add(S_EL[s], w * mult);
  }
  const ratio = S / T;
  const dist = [0, 0, 0, 0, 0];
  dist[dmEl] += 1;
  for (const k of ['year', 'month', 'hour']) if (P[k]) dist[S_EL[P[k][0]]] += 1;
  for (const k of ['year', 'month', 'day', 'hour']) {
    if (!P[k]) continue;
    const mult = k === 'month' ? 2.5 : k === 'day' ? 1.2 : 1;
    for (const [s, w] of HIDDEN[P[k][1]]) dist[S_EL[s]] += w * mult;
  }
  const dT = dist.reduce((a, b) => a + b, 0);
  const elementPct = dist.map((x) => Math.round((x / dT) * 1000) / 10);
  const level = ratio < 0.42 ? 'weak' : ratio > 0.58 ? 'strong' : ratio < 0.5 ? 'balanced-weak' : 'balanced-strong';
  const weakTab = { resource: 2, companion: 1, output: -1, wealth: -1, officer: -1 };
  const strongTab = { output: 1, wealth: 2, officer: 1, resource: -1, companion: -1 };
  const tab = level.includes('weak') ? weakTab : strongTab;
  const scale = level.startsWith('balanced') ? 0.6 : 1;
  const fav = [0, 0, 0, 0, 0];
  for (const [role, el] of Object.entries(R)) fav[el] = r2(tab[role] * scale);
  const order = [...EL.keys()].sort((a, b) => fav[b] - fav[a]);
  return {
    strength: { level, supportRatio: r2(ratio) }, roles: R, fav, elementPct,
    useful: order.filter((e) => fav[e] > 0).map((e) => EL[e]),
    unfavorable: order.filter((e) => fav[e] < 0).map((e) => EL[e]),
  };
}

const CLASH_NAME = { '2,8': 'เสือชนลิง', '3,9': 'กระต่ายชนไก่', '4,10': 'มังกรชนหมา', '0,6': 'หนูชนม้า', '1,7': 'วัวชนแพะ', '5,11': 'งูชนหมู' };
const clashName = (a, b) => CLASH_NAME[[Math.min(a, b), Math.max(a, b)].join(',')] + ' (' + BRANCHES[a] + BRANCHES[b] + '沖)';
const ROLE_TH = { resource: 'ธาตุหนุน', companion: 'ธาตุเพื่อน', output: 'ธาตุแสดงออก', wealth: 'ธาตุเงิน', officer: 'ธาตุงาน/กดดัน' };

/** Score one period pillar (s,b) for chart C, given other active branches ctx [{name, branch}] */
function scorePeriod(C, s, b, ctx = []) {
  const F = [];
  const add = (code, th, w, kind = code) => { if (w) F.push({ code, kind, th, w: r2(w) }); };
  const roleOf = (el) => Object.keys(C.roles).find((k) => C.roles[k] === el);
  const se = S_EL[s], be = B_EL[b];
  add('EL_STEM', `${EL_TH[EL[se]]} (${ROLE_TH[roleOf(se)]})`, C.fav[se]);
  add('EL_BRANCH', `${EL_TH[EL[be]]} (${ROLE_TH[roleOf(be)]})`, C.fav[be]);
  const nat = Object.entries(C.pillars).filter(([, v]) => v).map(([k, v]) => ({ name: k, s: v[0], b: v[1] }));
  const allB = [...nat.map((n) => n.b), ...ctx.map((c) => c.branch)];
  for (const n of nat) {
    if (mod(b - n.b, 12) === 6) {
      const w = n.name === 'day' ? -2 : EARTH_B.has(b) && EARTH_B.has(n.b) ? -0.5 : -1;
      add('CLASH', `${clashName(b, n.b)} กับ${NAT_TH[n.name]}`, w);
    }
    if (HARM.some(([x, y]) => (x === b && y === n.b) || (y === b && x === n.b))) add('HARM', `害 กับ${NAT_TH[n.name]}`, -0.5);
    if ((b === 0 && n.b === 3) || (b === 3 && n.b === 0)) add('PUNISH', `子卯刑 กับ${NAT_TH[n.name]}`, -1);
    if (b === n.b && SELF_P.has(b)) add('PUNISH', `${BRANCHES[b]}${BRANCHES[b]} ลงโทษตัวเอง`, -0.5);
    for (const [x, y, el] of SIX) {
      if ((x === b && y === n.b) || (y === b && x === n.b)) add('HARMONY', `${BRANCHES[x]}${BRANCHES[y]}合 กับ${NAT_TH[n.name]}`, 0.5 + C.fav[el] * 0.5);
    }
  }
  for (const c of ctx) {
    if (mod(b - c.branch, 12) === 6) add('CLASH', `${clashName(b, c.branch)} กับ${c.name}`, EARTH_B.has(b) && EARTH_B.has(c.branch) ? -0.4 : -0.75);
    if (HARM.some(([x, y]) => (x === b && y === c.branch) || (y === b && x === c.branch))) add('HARM', `害 กับ${c.name}`, -0.25);
  }
  const others = new Set(allB);
  for (const [set, el] of TRINE) {
    if (!set.includes(b)) continue;
    const n = set.filter((x) => x !== b && others.has(x)).length;
    if (n === 2) add('TRINE', `${set.map((x) => BRANCHES[x]).join('')} ${EL_TH[EL[el]]}ครบ`, C.fav[el] * 1.0);
    else if (n === 1) add('TRINE', `ครึ่งวง${EL_TH[EL[el]]}`, C.fav[el] * 0.25);
  }
  for (const [set, el] of DIREC) {
    if (set.includes(b) && set.filter((x) => x !== b && others.has(x)).length === 2) add('DIREC', `${set.map((x) => BRANCHES[x]).join('')} ${EL_TH[EL[el]]}รวมทิศ`, C.fav[el] * 1.0);
  }
  for (const set of PUNISH3) {
    if (!set.includes(b)) continue;
    const n = set.filter((x) => x !== b && others.has(x)).length;
    if (n === 2) add('PUNISH', `${set.map((x) => BRANCHES[x]).join('')}三刑`, -2);
    else if (n === 1) add('PUNISH', 'ครึ่ง三刑', -0.5);
  }
  const dm = C.dayMaster;
  const dmClash = (x) => (dm < 4 && x === dm + 6) || (dm >= 6 && x === dm - 6);
  if (mod(s - dm, 10) === 5) add('COMBINE_DM', `${STEMS[dm]}${STEMS[s]}合 โอกาสเงิน/คน`, 0.5);
  if (dmClash(s)) add('CLASH', `${STEMS[dm]}${STEMS[s]}冲 กับตัวคุณ`, -1);
  const [ds, db] = C.pillars.day;
  if (s === ds && b === db) add('FUYIN', 'ซ้ำกับเสาวันเกิด (伏吟)', -1);
  else for (const n of nat) if (n.name !== 'day' && n.s === s && n.b === b) add('FUYIN', `ซ้ำกับ${NAT_TH[n.name]} (伏吟)`, -0.5);
  if (dmClash(s) && mod(b - db, 12) === 6) add('FANYIN', 'ก้านและกิ่งชนวันเกิด (反吟)', -1);
  return { score: r2(F.reduce((a, f) => a + f.w, 0)), factors: F };
}
const noteOf = (F) => {
  const out = [];
  for (const f of [...F].sort((a, b) => Math.abs(b.w) - Math.abs(a.w))) {
    if (Math.abs(f.w) < 0.75 || out.includes(f.th)) continue;
    out.push(f.th); if (out.length === 2) break;
  }
  return out.length ? out.join(' · ') : 'ไม่มีแรงเด่น';
};
const healthRisk = (C, F, s, b) => {
  let r = F.filter((f) => HEALTH_CODES.has(f.code) && f.w < 0).reduce((a, f) => a - f.w, 0);
  const off = C.roles.officer;
  if (C.strength.level.includes('weak') && (S_EL[s] === off || B_EL[b] === off)) r += 0.5;
  return r2(r);
};

  const home = homeClash || isHorse ? (me === 'caution' ? 'forced' : 'move') : sixDay || (resIn && me === 'support') ? 'improve' : 'stay';
  const dayClash = clashW(P.day[1]);

    : dayClash && health === 'caution' ? 'careful' : 'normal';

}

const iso = (ms, tz) => {

  const sign = tz >= 0 ? '+' : '-', a = Math.abs(tz);

const luckAt = (C, ms) => C.luck.find((l) => l.start <= ms && ms < l.end) ?? null;
const THRESH = { annual: { hi: 1.5, lo: -2.5, luckWeight: 0.25 }, monthly: { hi: 0.5, lo: -2.0 }, daily: { hi: 0.25, lo: -2.5 }, dayBase: { support: 0.5, neutral: 0, caution: -0.5 }, base: { support: 0.7, neutral: 0, caution: -0.7 } };

/** Build full reading for years [from, to] (Chinese years, start at 立春). */
function reading(person, { from = 2026, to = 2050 } = {}) {
  const C = natalChart(person);
  const tz = C.input.tz;
  const annual = [], monthly = [];

    const [ys, yb] = yearPillarOf(cy);
    const yStart = termTime(cy, 315), yEnd = termTime(cy + 1, 315);
    const mid = yStart + (yEnd - yStart) / 2;
    const L = luckAt(C, mid);
    const ctxY = L ? [{ name: 'วัยจร', branch: L.branch }] : [];
    const ly = L ? scorePeriod(C, L.stem, L.branch) : { score: 0 };
    const y = scorePeriod(C, ys, yb, ctxY);
    const yScore = r2(y.score + THRESH.annual.luckWeight * ly.score);
    const yTag = meTag(yScore, THRESH.annual.hi, THRESH.annual.lo);
    const wy = worldYear(cy);
    annual.push({ year: cy, pillar: pillar(ys, yb), animal: ANIMAL[yb], elements_th: EL_TH[EL[S_EL[ys]]] + '+' + EL_TH[EL[B_EL[yb]]],
      start: iso(yStart, tz), end: iso(yEnd, tz), luck_pillar: L?.pillar ?? null,
      me: { tag: yTag, label_th: LABEL_TH.me[yTag], score: yScore, note_th: noteOf(y.factors), factors: y.factors },
      world: wy && { ...wy, label_th: LABEL_TH.world[wy.tag] },
      topics: topics(C, yTag, wy, ys, yb, y.factors) });
    let t = yStart;
    for (let i = 0; i < 12; i++) {
      const mo = monthAt(t + 60000);
      const Lm = luckAt(C, mo.start + (mo.end - mo.start) / 2);
      const ctx = [{ name: 'ปีนี้', branch: yb }, ...(Lm ? [{ name: 'วัยจร', branch: Lm.branch }] : [])];
      const m = scorePeriod(C, mo.stem, mo.branch, ctx);
      const sc = r2(m.score + THRESH.base[yTag]);
      const tag = meTag(sc, THRESH.monthly.hi, THRESH.monthly.lo);
      const wm = wy ? worldMonth(mo.stem, mo.branch, ys, yb, wy.tag) : null;
      const mid2 = new Date(mo.start + tz * 3600000 + 10 * 86400000);
      monthly.push({ id: `${cy}-${String(i + 1).padStart(2, '0')}`, chinese_year: cy, month_no: i + 1,
        label_th: `${MONTH_TH[mid2.getUTCMonth()]} ${mid2.getUTCFullYear()}`, start: iso(mo.start, tz), end: iso(mo.end, tz),
        year_pillar: pillar(ys, yb), month_pillar: pillar(mo.stem, mo.branch), luck_pillar: Lm?.pillar ?? null,
        me: { tag, label_th: LABEL_TH.me[tag], score: sc, note_th: noteOf(m.factors), factors: m.factors },
        world: wm && { ...wm, label_th: LABEL_TH.world[wm.tag] },
        topics: topics(C, tag, wm, mo.stem, mo.branch, m.factors) });
      t = mo.end;
    }
  }
  // bargain signal (annual)
  for (let i = 0; i < annual.length; i++) {
    const a = annual[i], w = a.world?.tag, pw = annual[i - 1]?.world?.tag, p2 = annual[i - 2]?.world?.tag, me = a.me.tag;

    }

  }
  const P = C.pillars;
  return {
    engine: VERSION,
    disclaimer_th: 'อ่านเชิงสัญลักษณ์ตามหลักปาจื้อ ไม่ใช่คำทำนายเหตุการณ์จริง ไม่ใช่คำแนะนำการลงทุนหรือการแพทย์',
    person: { name: person.name ?? null, gender: person.gender, date: person.date, time: person.time ?? null, tz, longitude: person.longitude ?? null },
    natal: {
      pillars: { year: pillar(...P.year), month: pillar(...P.month), day: pillar(...P.day), hour: P.hour ? pillar(...P.hour) : null },
      day_master: STEMS[C.dayMaster] + ' ' + EL_TH[EL[S_EL[C.dayMaster]]] + (C.dayMaster % 2 ? 'หยิน' : 'หยาง'),
      strength: C.strength, useful: C.useful, unfavorable: C.unfavorable,
      favorability: Object.fromEntries(EL.map((e, i) => [e, C.fav[i]])),
      elements_pct: Object.fromEntries(EL.map((e, i) => [e, C.elementPct[i]])),
      roles: Object.fromEntries(Object.entries(C.roles).map(([r, e]) => [r, { element: EL[e], pct: C.elementPct[e] }])),
      solar_correction_min: C.solarCorrectionMin, has_time: C.hasTime,
      chinese_year: chineseYear(C.birthMs), horse_branch: BRANCHES[[8, 0, 4].includes(C.pillars.day[1]) ? 2 : [2, 6, 10].includes(C.pillars.day[1]) ? 8 : [5, 9, 1].includes(C.pillars.day[1]) ? 11 : 5],
      luck_direction: C.forward ? 'forward' : 'reverse', luck_start: iso(C.luckStart, tz),
      luck_pillars: C.luck.map((l) => {
        const sc = scorePeriod(C, l.stem, l.branch).score;
        const tag = sc >= 1.5 ? 'support' : sc <= -1.5 ? 'caution' : 'neutral';
        return { pillar: l.pillar, start: iso(l.start, tz), end: iso(l.end, tz), score: r2(sc), tag, label_th: LABEL_TH.me[tag] };
      }),
    },
    annual, monthly,
  };
}

const HOUR_TH = ['23:00–00:59', '01:00–02:59', '03:00–04:59', '05:00–06:59', '07:00–08:59', '09:00–10:59', '11:00–12:59', '13:00–14:59', '15:00–16:59', '17:00–18:59', '19:00–20:59', '21:00–22:59'];
const natalCache = new Map();
/**
 * Daily readings for `days` civil dates from `startDate` (YYYY-MM-DD, local tz), inside the span of R.
 * Day score = day pillar vs chart (with year, month and luck branches as context) + base from the month's tag.
 */
function daily(person, R, startDate, days = 1) {
  const key = JSON.stringify([person.date, person.time, person.gender, person.longitude, person.tz]);
  if (!natalCache.has(key)) natalCache.set(key, natalChart(person));
  const C = natalCache.get(key), tz = C.input.tz;
  const [y0, m0, d0] = startDate.split('-').map(Number);
  const out = [];
  for (let k = 0; k < days; k++) {
    const dt = new Date(Date.UTC(y0, m0 - 1, d0 + k));
    const Y = dt.getUTCFullYear(), Mo = dt.getUTCMonth() + 1, D = dt.getUTCDate();
    const noon = Date.UTC(Y, Mo - 1, D, 12) - tz * 3600000;
    const M = monthFor(R, noon);
    if (!M) continue;
    const [ds, db] = dayPillarOfDate(Y, Mo, D);
    const yb = BRANCHES.indexOf(M.year_pillar[1]), mb = BRANCHES.indexOf(M.month_pillar[1]);
    const ctx = [{ name: 'ปีนี้', branch: yb }, { name: 'เดือนนี้', branch: mb }];
    if (M.luck_pillar) ctx.push({ name: 'วัยจร', branch: BRANCHES.indexOf(M.luck_pillar[1]) });
    const f = scorePeriod(C, ds, db, ctx);
    const sc = r2(f.score + THRESH.dayBase[M.me.tag]);
    const tag = meTag(sc, THRESH.daily.hi, THRESH.daily.lo);
    // hours: 12 two-hour blocks; stem from day stem (五鼠遁)
    const hours = Array.from({ length: 12 }, (_, i) => {
      const hs = ((ds % 5) * 2 + i) % 10;
      let w = C.fav[S_EL[hs]] * 0.5 + C.fav[B_EL[i]];
      if (mod(i - C.pillars.day[1], 12) === 6) w -= 2;
      if (mod(i - db, 12) === 6) w -= 1;
      if (SIX.some(([x, z]) => (x === i && z === C.pillars.day[1]) || (z === i && x === C.pillars.day[1]))) w += 0.5;
      return { branch: BRANCHES[i], animal: ANIMAL[i], pillar: pillar(hs, i), time_th: HOUR_TH[i], score: r2(w) };
    });
    const ranked = [...hours].sort((a, b) => b.score - a.score);
    const iso2 = `${Y}-${String(Mo).padStart(2, '0')}-${String(D).padStart(2, '0')}`;
    out.push({ date: iso2, weekday: dt.getUTCDay(), pillar: pillar(ds, db), animal: ANIMAL[db],
      elements_th: EL_TH[EL[S_EL[ds]]] + '+' + EL_TH[EL[B_EL[db]]], month_id: M.id, month_pillar: M.month_pillar, year: M.chinese_year,
      me: { tag, label_th: LABEL_TH.me[tag], score: sc, note_th: noteOf(f.factors), factors: f.factors },
      world: M.world, topics: topics(C, tag, M.world, ds, db, f.factors),
      good_hours: ranked.filter((h) => h.score > 0).slice(0, 3), bad_hours: hours.filter((h) => h.score <= -2), hours });
  }
  return out;
}

/** Find the monthly row for an instant (ms) inside a reading. */
function monthFor(R, ms) {
  return R.monthly.find((m) => Date.parse(m.start) <= ms && ms < Date.parse(m.end)) ?? null;
}

// ---------- storage: private db subtree → localStorage → memory ----------
let dbRef = null;
function lsGet() { try { return JSON.parse(localStorage.getItem('bazi-people') || 'null'); } catch { return null; } }
function lsSet(v) { try { localStorage.setItem('bazi-people', JSON.stringify(v)); return true; } catch { return false; } }
async function save() {
  const body = { list: S.people, current: S.current, updated: new Date().toISOString() };
  if (dbRef) { try { await dbRef.set(body); S.storage = 'db'; lsSet(body); return true; } catch { dbRef = null; } }
  const ok = lsSet(body); S.storage = ok ? 'local' : 'memory'; return ok;
}
function validPerson(p) { try { natalChart(p); return true; } catch { return false; } }
function applyStored(v) {
  if (v && Array.isArray(v.list)) {
    S.people = v.list.filter(validPerson);
    S.current = S.people.some((p) => p.id === v.current) ? v.current : S.people[0]?.id ?? null;
  }
}
async function initStorage() {
  const local = lsGet();
  if (local) { applyStored(local); S.storage = 'local'; }
  render();
  if (!window.claude?.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) return;
    dbRef = db.doc('data/users/' + uid + '/people');
    const snap = await Promise.race([dbRef.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]);
    if (snap.exists) { applyStored(snap.data()); S.storage = 'db'; lsSet(snap.data()); }
    else if (S.people.length) await save();
    else S.storage = 'db';
    S.cache.clear(); S.year = null;
    render();
  } catch { dbRef = null; }
}

  const cy = Math.min(2050, Math.max(2026, chineseYear(Date.now())));

function chart25(R) {
  const W = 340, H = 150, bw = W / 25, mid = 70, sc = 7;
  const bars = R.annual.map((a, i) => {
    const v = Math.max(-8, Math.min(8, a.me.score)), h = Math.max(3, Math.abs(v) * sc);
    const y = v >= 0 ? mid - h : mid;
    const col = { support: '#2F8A4C', neutral: '#C9A23B', caution: '#C2533B' }[a.me.tag];
    const wdot = a.world?.tag === 'high' ? `<circle cx="${i * bw + bw / 2}" cy="${H - 22}" r="3.5" fill="#3346A0"/>` : '';
    const sel = a.year === S.year ? `<rect x="${i * bw}" y="0" width="${bw}" height="${H - 14}" fill="#1C1B1A" opacity=".07" rx="3"/>` : '';
    return `<g data-act="year" data-v="${a.year}" style="cursor:pointer">${sel}<rect x="${i * bw}" y="0" width="${bw}" height="${H}" fill="transparent"/>
      <rect x="${i * bw + 2}" y="${y}" width="${bw - 4}" height="${h}" rx="2" fill="${col}"/>${wdot}
      ${i % 4 === 0 ? `<text x="${i * bw + bw / 2}" y="${H - 2}" text-anchor="middle" font-size="10" fill="#6B675F">${String(a.year).slice(2)}</text>` : ''}</g>`;
  }).join('');
  return `<section class="card"><div class="row sb"><h2 class="mt0">ภาพรวม 25 ปี ${info('score')}</h2><span class="sm dim">แตะแท่งเพื่อเลือกปี</span></div>

    <div class="legend sm"><span><i style="background:#2F8A4C"></i>หนุน</span><span><i style="background:#C9A23B"></i>กลาง</span><span><i style="background:#C2533B"></i>ระวัง</span><span><i class="dot" style="background:#3346A0"></i>โลกผันผวนสูง</span></div></section>`;
}

function worldTopics(Y) {
  const w = Y.world?.tag || 'mid', L = LABEL_TH.world, watch = Y.world?.watch_th || '';
  const disaster = /น้ำท่วม|แผ่นดินไหว|ดินถล่ม|ไฟป่า|พายุ|ฝนหนัก/.test(watch);
  const rows = [
    ['work', 'สายงานที่โลกหนุน: ' + (Y.world?.good_th || '–'), 'none', 'ข้อมูล'],
    ['money', w === 'high' ? 'สภาพคล่องตึง ถือเงินสดมากขึ้น' : w === 'mid' ? 'เงินหมุนปกติ' : 'เงินหมุนคล่อง', w, L[w]],
    ['health', 'ภัยที่ต้องระวัง: ' + (watch || '–'), w, L[w]],
    ['business', 'ธุรกิจที่โลกหนุน: ' + (Y.world?.good_th || '–'), 'none', 'ข้อมูล'],
    ['home', disaster ? 'ระวังภัยต่อที่อยู่อาศัย: ' + watch + ' ตรวจประกันบ้าน' : 'ไม่มีภัยต่อที่อยู่อาศัยเด่น', disaster ? 'high' : 'low', disaster ? 'ระวัง' : 'ปกติ'],
    ['travel', w === 'high' || disaster ? 'ติดตามข่าวก่อนเดินทาง ซื้อประกันเดินทาง' : 'เดินทางได้ตามปกติ', w === 'high' || disaster ? 'high' : 'low', w === 'high' || disaster ? 'ระวัง' : 'ปกติ'],
    ['gold', Y.topics.gold.code === 'add' ? 'แรงหนุนทองเด่น' : 'แรงหนุนทองเบา', Y.topics.gold.code, Y.topics.gold.label_th],
    ['stock', w === 'high' ? 'ตลาดแกว่งแรง' : w === 'mid' ? 'ตลาดปกติ มีแกว่งบางช่วง' : 'ตลาดค่อนข้างสงบ', w, 'แกว่ง' + L[w]],
  ];
  return `<h2>8 ด้านฝั่งโลก</h2><div class="list">${rows.map(([k, b, c, d]) => `<div class="card lrow"><b class="w80">${TOPIC_ICON[k]} ${TSHORT[k]}</b><span class="sm grow">${esc(b)}</span>${pill(c, d)}</div>`).join('')}</div>`;
}
function worldNarrative(Y) {
  const sEl = charEl(Y.pillar[0]), bEl = charEl(Y.pillar[1]);
  const era = Y.year < 2044
    ? 'ยุค 9 ไฟ (2024–2043) ตามหลักฮวงจุ้ยซานหยวน เด่นเรื่องเทคโนโลยี AI สื่อ พลังงาน ความงาม และจิตวิญญาณ แต่มากับความร้อน ความขัดแย้ง และกระแสที่มาเร็วไปเร็ว'
    : 'ยุค 1 น้ำ (2044–2063) ตามหลักฮวงจุ้ยซานหยวน เด่นเรื่องการค้า การเคลื่อนย้าย ข้อมูล การสื่อสาร และความยืดหยุ่น';
  return sec(`อ่านโลกปี ${Y.year} แบบละเอียด`, `<div class="prose sm">
    <p><b>ยุค</b> ${era}</p>
    <p><b>ธาตุของปี</b> ก้านปี ${elChar(Y.pillar[0])} ธาตุ${EL_NAME[sEl]} เกี่ยวกับ${W_THEME[sEl]} กิ่งปี ${elChar(Y.pillar[1])} ธาตุ${EL_NAME[bEl]} เกี่ยวกับ${W_THEME[bEl]}${sEl === bEl ? ' ทั้งก้านและกิ่งเป็นธาตุเดียวกัน พลังจึงแรงเป็นพิเศษ' : ''}</p>
    <p><b>สรุป</b> ด้านที่ดี: ${esc(Y.world?.good_th)} · ด้านที่ต้องระวัง: ${esc(Y.world?.watch_th)} ระดับผันผวน${Y.world?.label_th || '–'}</p>
    <p class="dim">ฝั่งโลกเป็นการอ่านตามกรอบปาจื้อเชิงสัญลักษณ์ ไม่ใช่การพยากรณ์เศรษฐกิจ ใช้คู่กับข่าวและข้อมูลจริงเสมอ</p></div>`);
}
function noteCard(p, Y) {
  const v = p.notes?.[Y.year] || '';
  return `<section class="card"><h2 class="mt0">📝 ปี ${Y.year} เกิดอะไรจริง</h2>
    <p class="sm dim">จดเหตุการณ์จริงไว้เทียบกับที่แอปบอก ปีหน้ามาดูว่าตรงแค่ไหน</p>
    <textarea id="note" rows="3" maxlength="1000" placeholder="เช่น ได้ขึ้นเงินเดือน ย้ายบ้าน ร้านยอดตก ป่วยช่วง มี.ค.">${esc(v)}</textarea>
    <div class="row sb"><span class="sm dim" id="notemsg">${esc(S.noteMsg)}</span><button class="btn2" data-act="savenote" data-v="${Y.year}">บันทึก</button></div></section>`;
}
function monthGrid(months) {
  return `<div class="row sb mt"><h2>รายเดือน</h2><span class="sm dim">แตะเพื่อดูรายละเอียด</span></div>
  <div class="g4">${months.map((m) => {
    const t = S.view === 'me' ? m.me : m.world;
    return `<button class="mcell t-${TONE[t?.tag] || 'n'} ${m.id === S.month ? 'sel' : ''}" data-act="month" data-v="${m.id}" aria-pressed="${m.id === S.month}">
      <b>${m.label_th.split(' ')[0]}</b><small>${esc(m.month_pillar)}</small><small>${esc(t?.label_th || '–')}</small></button>`;
  }).join('')}</div>`;
}
function monthDetail(M, R) {
  const tp = M.topics, n = R.natal;
  const mEl = charEl(M.month_pillar[0]), bEl = charEl(M.month_pillar[1]);
  const factors = M.me.factors.slice().sort((a, b) => Math.abs(b.w) - Math.abs(a.w)).slice(0, 6)
    .map((f) => `<li><span>${esc(f.th)}</span><span class="${f.w > 0 ? 'pos' : 'neg'}">${f.w > 0 ? '+' : ''}${f.w}</span></li>`).join('');
  return `<section class="card">
    <div class="row sb"><span class="sm dim">${esc(M.label_th)} · ${fmtDate(M.start)} – ${fmtDate(M.end)}</span><b>${elChar(M.month_pillar[0])}${elChar(M.month_pillar[1])}</b></div>
    <div class="g2 mt8">
      <div class="box2"><small>ฉัน</small>${pill(M.me.tag, M.me.label_th)}<div class="sm">${esc(M.me.note_th)}</div></div>
      <div class="box2"><small>โลก</small>${M.world ? pill(M.world.tag, 'ผันผวน' + M.world.label_th) : '–'}<div class="sm">ดี: ${esc(M.world?.good_th)}<br>ระวัง: ${esc(M.world?.watch_th)}</div></div>
    </div>
    <p class="sm mt8">เดือนนี้ธาตุ${EL_NAME[mEl]} (${ROLE[roleOfEl(n, mEl)].name}): ${ROLE_YEAR[roleOfEl(n, mEl)][n.favorability[mEl] > 0 ? 0 : 1]}${mEl !== bEl ? ` · ธาตุ${EL_NAME[bEl]} (${ROLE[roleOfEl(n, bEl)].name}): ${ROLE_YEAR[roleOfEl(n, bEl)][n.favorability[bEl] > 0 ? 0 : 1]}` : ''}</p>
    <div class="tline">${TOPICS.map(([k]) => `<span>${TSHORT[k]} ${pill(tp[k].code, tp[k].label_th)}</span>`).join('')}</div>
    <button class="btn2 ghost2 mt8 wide" data-act="dpick" data-v="${clampDay(M.start.slice(0, 10))}">ดูรายวันของเดือนนี้ →</button>
    <details><summary>ทำไมได้ผลนี้ (คะแนน ${M.me.score})</summary><ul class="facts">${factors}</ul><button class="link sm" data-act="term" data-v="clash">คำว่า ชน รวม ทับ หมายถึงอะไร</button></details>
  </section>`;
}
function topicTable(months) {
  const th = TSHORT[S.topic];
  return `<h2>${TOPIC_ICON[S.topic]} ${th}: ฉัน vs โลก ทีละเดือน</h2><div class="card tbl">
    <div class="tr hd"><span>เดือน</span><span>ฉัน</span><span>โลก</span><span>${th}</span></div>
    ${months.map((m) => `<div class="tr"><span>${esc(m.label_th.split(' ')[0])}</span>${pill(m.me.tag, m.me.label_th)}${m.world ? pill(m.world.tag, m.world.label_th) : '<span>–</span>'}${pill(m.topics[S.topic].code, m.topics[S.topic].label_th)}</div>`).join('')}
  </div>`;
}
function timeline(R) {
  const p = currentPerson();
  return `<h2>ไทม์ไลน์ 2026–2050</h2><div class="list">${R.annual.map((a) => {
    const t = S.view === 'me' ? a.me : a.world;
    const note = S.view === 'me' ? `งาน${a.topics.work.label_th} · เงิน${a.topics.money.label_th} · ${a.topics.home.label_th}` : a.world?.watch_th;
    const mark = S.view === 'me' && p.notes?.[a.year] ? ' 📝' : '';
    return `<button class="card lrow ${a.year === S.year ? 'sel' : ''}" data-act="year" data-v="${a.year}"><b class="w56">${a.year}</b><span class="sm grow">${esc(a.pillar)} · ${esc(note)}${mark}</span>${pill(t?.tag, t?.label_th || '–')}</button>`;
  }).join('')}</div>`;
}

// ---------- people & form ----------
function onboarding() {
  return `<section class="hero me"><span class="big">ปาจื้อ</span><p>วิเคราะห์ธาตุและบุคลิก แล้วดูดวงรายปีรายเดือน 2026–2050 ทั้งฝั่งตัวเองและฝั่งโลก 8 ด้าน การงาน เงิน สุขภาพ ธุรกิจ ที่อยู่อาศัย เดินทาง ทอง หุ้น</p>
    <button class="btn" data-act="add">เพิ่มวันเกิดคนแรก</button></section>
  <div class="card sm"><b>จัดทำขึ้นเพื่อ</b> ${PURPOSE} <button class="link" data-act="view" data-v="guide">อ่านคู่มือ</button></div>`;
}
function panelHtml() {
  if (!S.panel) return '';
  const body = S.panel === 'people' ? peoplePanel() : formPanel();
  return `<div class="scrim" data-act="close"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="${S.panel === 'people' ? 'รายชื่อคน' : 'เพิ่มวันเกิด'}">${body}</section>`;
}
function peoplePanel() {
  const store = { db: 'บันทึกในบัญชี claude.ai ของคุณ (เห็นคนเดียว)', local: 'บันทึกในเบราว์เซอร์นี้', memory: 'ยังไม่ได้บันทึก (หายเมื่อปิดหน้า)' }[S.storage];
  const cy = S.year || 2026;
  return `<div class="row sb"><h2>ดวงของใคร</h2><button class="icon" data-act="close" aria-label="ปิด">✕</button></div>
  <div class="list">${S.people.map((p) => {
    const R = readingFor(p); const a = R.annual.find((x) => x.year === cy);
    return `<div class="card lrow ${p.id === S.current ? 'sel' : ''}">
      <button class="grow plain" data-act="pick" data-v="${esc(p.id)}"><span class="avatar">${esc(R.natal.pillars.day[0])}</span><span class="who-t"><b>${esc(p.name || 'ไม่มีชื่อ')}</b><small>${esc(fmtBirth(p))} · ${p.gender === 'F' ? 'หญิง' : 'ชาย'}</small></span></button>
      ${pill(a.me.tag, a.me.label_th)}
      <button class="icon" data-act="del" data-v="${esc(p.id)}" aria-label="ลบ ${esc(p.name)}">🗑</button></div>`;
  }).join('') || '<p class="muted">ยังไม่มีรายชื่อ</p>'}</div>
  <p class="sm dim">ป้ายคือดวงปี ${cy} ของแต่ละคน · ${store}</p>
  <button class="btn" data-act="add">+ เพิ่มคน</button>
  ${STANDALONE ? `<div class="g2"><button class="btn2 ghost2" data-act="backup">⬇ สำรองข้อมูล</button><label class="btn2 ghost2 filebtn">⬆ นำเข้าข้อมูล<input type="file" id="restore" accept=".json,application/json" hidden></label></div>
  <p class="sm dim" id="bmsg">ข้อมูลเก็บในเครื่องนี้เท่านั้น สำรองไว้เป็นไฟล์ก่อนล้างเบราว์เซอร์หรือเปลี่ยนเครื่อง</p>` : ''}`;
}
function formPanel() {
  return `<div class="row sb"><h2>เพิ่มวันเกิด</h2><button class="icon" data-act="close" aria-label="ปิด">✕</button></div>
  <form id="pf" novalidate>
    <label>ชื่อเล่น<input name="name" maxlength="40" placeholder="เช่น แม่ น้องฝน" required></label>
    <fieldset><legend>เพศ (ใช้หาทิศของวัยจร)</legend><div class="g2">
      <label class="radio"><input type="radio" name="gender" value="F" checked>หญิง</label>
      <label class="radio"><input type="radio" name="gender" value="M">ชาย</label></div></fieldset>
    <div class="g2"><label>วันเกิด<input type="date" name="date" min="1900-01-01" max="2100-12-31" required></label>
    <label>เวลาเกิด<input type="time" name="time"></label></div>
    <label class="check"><input type="checkbox" name="notime">ไม่ทราบเวลาเกิด (ดู 3 เสา)</label>
    <label>จังหวัดที่เกิด (ไม่บังคับ)<select name="lon">${PROVINCES.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>
      <small class="dim">ปรับเป็นเวลาสุริยะจริง มีผลเมื่อเกิดใกล้รอยต่อยาม</small></label>
    <div id="preview" class="card soft sm">กรอกวันเกิดเพื่อดูตัวอย่าง 4 เสา</div>
    <label class="check"><input type="checkbox" name="consent">เจ้าของวันเกิดยินยอมให้บันทึกข้อมูลนี้</label>
    <p id="ferr" class="err" role="alert">${esc(S.err)}</p>
    <button class="btn" type="submit">บันทึกและดูดวง</button>
  </form>`;
}
function formPerson(f) {
  const fd = new FormData(f); const lon = fd.get('lon');
  return { name: String(fd.get('name') || '').trim(), gender: fd.get('gender'), date: fd.get('date'),
    time: fd.get('notime') ? null : fd.get('time') || null, tz: 7, longitude: lon ? +lon : undefined };
}
function updatePreview() {
  const f = document.getElementById('pf'); if (!f) return;
  const box = document.getElementById('preview'); const p = formPerson(f);
  if (!p.date) { box.textContent = 'กรอกวันเกิดเพื่อดูตัวอย่าง 4 เสา'; return; }
  try {
    const C = natalChart(p); const P = C.pillars; const pl = (v) => (v ? pillar(...v) : '–');
    box.innerHTML = `<div class="pgrid"><div class="pc"><small>ชั่วโมง</small><b>${pl(P.hour)}</b></div><div class="pc on"><small>วัน</small><b>${pl(P.day)}</b></div><div class="pc"><small>เดือน</small><b>${pl(P.month)}</b></div><div class="pc"><small>ปี</small><b>${pl(P.year)}</b></div></div>
      <div class="mt8">${STRENGTH_TH[C.strength.level]} · ธาตุช่วย ${C.useful.map((e) => EL_NAME[e]).join(', ')}${C.solarCorrectionMin ? ` · ปรับเวลา ${C.solarCorrectionMin} นาที` : ''}</div>`;
  } catch (e) { box.textContent = e.message; }
}

// ---------- events ----------
app.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === 'term') { S.view = 'guide'; S.term = v; render(); return; }
  if (act === 'dstep') { S.day = clampDay(addDays(S.day, +v)); S.noteMsg = ''; render(); return; }
  if (act === 'dtoday') { S.day = clampDay(isoLocal(new Date())); S.noteMsg = ''; render(); return; }
  if (act === 'dpick') { S.day = clampDay(v); S.view = 'day'; S.noteMsg = ''; render(); if (!el.classList.contains('cday')) window.scrollTo({ top: 0 }); return; }
  if (act === 'view') { S.view = v; S.noteMsg = ''; window.scrollTo({ top: 0 }); render(); }
  else if (act === 'year' || act === 'goyear') {
    S.year = +v; S.noteMsg = '';
    if (act === 'goyear') S.view = 'me';
    const R = readingFor(currentPerson()); S.month = R.monthly.find((m) => m.chinese_year === S.year).id;
    render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  else if (act === 'month') { S.month = v; render(); }
  else if (act === 'topic') { S.topic = v; render(); }
  else if (act === 'people') { S.panel = 'people'; render(); }
  else if (act === 'add') { S.panel = 'form'; S.err = ''; render(); }
  else if (act === 'close') { S.panel = null; render(); }
  else if (act === 'pick') { S.current = v; S.panel = null; S.view = 'profile'; S.year = null; await save(); render(); window.scrollTo({ top: 0 }); }
  else if (act === 'savenote') {
    const p = currentPerson(); const txt = document.getElementById('note').value.trim();
    p.notes = { ...(p.notes || {}) }; if (txt) p.notes[v] = txt; else delete p.notes[v];
    const ok = await save(); S.noteMsg = ok ? 'บันทึกแล้ว' : 'บันทึกไม่ได้ในเบราว์เซอร์นี้'; render();
  }
  else if (act === 'backup') {
    const blob = new Blob([JSON.stringify({ app: 'bazi', version: 1, list: S.people, current: S.current }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'bazi-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    const m = document.getElementById('bmsg'); if (m) m.textContent = 'ดาวน์โหลดไฟล์สำรองแล้ว';
  }
  else if (act === 'del') {
    if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'ลบ?'; el.classList.add('danger'); return; }
    S.people = S.people.filter((p) => p.id !== v);
    if (S.current === v) { S.current = S.people[0]?.id ?? null; S.year = null; }
    await save(); render();
  }
});
app.addEventListener('input', (e) => {
  if (e.target.closest('#pf')) { S.err = ''; const er = document.getElementById('ferr'); if (er) er.textContent = ''; updatePreview(); }
  if (e.target.id === 'note') { const m = document.getElementById('notemsg'); if (m) m.textContent = 'ยังไม่ได้บันทึก'; }
});
app.addEventListener('change', async (e) => {
  if (e.target.closest('#pf')) updatePreview();
  if (e.target.id === 'dpick' && e.target.value) { S.day = clampDay(e.target.value); S.noteMsg = ''; render(); }
  if (e.target.id === 'restore' && e.target.files[0]) {
    const m = document.getElementById('bmsg');
    try {
      const v = JSON.parse(await e.target.files[0].text());
      if (!v || !Array.isArray(v.list)) throw new Error();
      const ok = v.list.filter((p) => p && typeof p.id === 'string' && validPerson(p));
      const have = new Set(S.people.map((p) => p.id));
      const added = ok.filter((p) => !have.has(p.id));
      S.people.push(...added); if (!S.current) S.current = S.people[0]?.id ?? null;
      S.cache.clear(); S.year = null; await save(); render();
      const m2 = document.getElementById('bmsg'); if (m2) m2.textContent = `นำเข้า ${added.length} คน${ok.length - added.length ? ` (ข้าม ${ok.length - added.length} คนที่มีอยู่แล้ว)` : ''}`;
    } catch { if (m) m.textContent = 'ไฟล์นี้ไม่ใช่ไฟล์สำรองของแอปนี้'; }
  }
});
app.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target; const p = formPerson(f); const fd = new FormData(f);
  const er = document.getElementById('ferr'); const fail = (m) => { S.err = m; er.textContent = m; };
  if (!p.name) return fail('ใส่ชื่อเล่นก่อน');
  if (!p.date) return fail('ใส่วันเกิดก่อน');
  if (!fd.get('notime') && !p.time) return fail('ใส่เวลาเกิด หรือติ๊ก "ไม่ทราบเวลาเกิด"');
  if (!fd.get('consent')) return fail('ต้องได้รับความยินยอมจากเจ้าของวันเกิดก่อนบันทึก');
  try { natalChart(p); } catch (x) { return fail(x.message); }
  p.id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  S.people.push(p); S.current = p.id; S.panel = null; S.year = null; S.view = 'profile'; S.err = '';
  await save(); render(); window.scrollTo({ top: 0 });
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.panel) { S.panel = null; render(); } });

initStorage();

}
</script>
